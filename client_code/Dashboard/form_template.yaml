      properties: {text: 'Ativos Cadastrados', align: center, font_size: 13, foreground: '#64748b', bold: true}
      type: Label
    name: card_total
    properties: {role: glass-card}
    type: ColumnPanel
  - components:
    - name: lbl_vencidos_val
      properties: {text: '0', font_size: 32, bold: true, align: center, foreground: '#ef4444'}
      type: Label
    - name: lbl_vencidos_desc
      properties: {text: 'Ativos Vencidos', align: center, font_size: 13, foreground: '#64748b', bold: true}
      type: Label
    name: card_vencidos
    properties: {role: glass-card}
    type: ColumnPanel
  - components:
    - name: lbl_unidades_val
      properties: {text: '0', font_size: 32, bold: true, align: center, foreground: '#10b981'}
      type: Label
    - name: lbl_unidades_desc
      properties: {text: 'Plantas / Unidades', align: center, font_size: 13, foreground: '#64748b', bold: true}
      type: Label
    name: card_unidades
    properties: {role: glass-card}
    type: ColumnPanel
  - components:
    - name: lbl_instrumentos_val
      properties: {text: '0', font_size: 32, bold: true, align: center, foreground: '#f59e0b'}

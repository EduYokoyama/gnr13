components:
- layout_properties: {grid_position: 'A,B'}
  name: label_title
  properties: {align: left, bold: true, role: headline, text: Painel de Conformidade Regulatório NR-13}
  type: Label
- components:
  - components:
    - name: lbl_total_val
      properties: {align: center, bold: true, font_size: 32, foreground: '#3b82f6', text: '0'}
      type: Label
    - name: lbl_total_desc
      properties: {align: center, bold: true, font_size: 13, foreground: '#64748b', text: Ativos Cadastrados}
      type: Label
    event_bindings: {click: card_total_click}
    name: card_total
    properties: {role: glass-card}
    type: Link
  - components:
    - name: lbl_vencidos_val
      properties: {align: center, bold: true, font_size: 32, foreground: '#ef4444', text: '0'}
      type: Label
    - name: lbl_vencidos_desc
      properties: {align: center, bold: true, font_size: 13, foreground: '#64748b', text: Ativos Vencidos}
      type: Label
    event_bindings: {click: card_vencidos_click}
    name: card_vencidos
    properties: {role: glass-card}
    type: Link
  - components:
    - name: lbl_unidades_val
      properties: {align: center, bold: true, font_size: 32, foreground: '#10b981', text: '0'}
      type: Label
    - name: lbl_unidades_desc
      properties: {align: center, bold: true, font_size: 13, foreground: '#64748b', text: Plantas / Unidades}
      type: Label
    event_bindings: {click: card_unidades_click}
    name: card_unidades
    properties: {role: glass-card}
    type: Link
  - components:
    - name: lbl_instrumentos_val
      properties: {align: center, bold: true, font_size: 32, foreground: '#f59e0b', text: '0'}
      type: Label
    - name: lbl_instrumentos_desc
      properties: {align: center, bold: true, font_size: 13, foreground: '#64748b', text: Instrumentos Vencidos}
      type: Label
    event_bindings: {click: card_instrumentos_click}
    name: card_instrumentos
    properties: {role: glass-card}
    type: Link
  layout_properties: {grid_position: 'C,D'}
  name: flow_panel_stats
  properties: {align: justify, spacing: medium}
  type: FlowPanel
- components:
  - name: plot_status
    properties: {height: 380}
    type: Plot

  - name: plot_forecast_ativos
    properties: {height: 380}
    type: Plot
  layout_properties: {grid_position: 'E,F'}
  name: flow_panel_assets
  properties: {align: justify, spacing: large}
  type: FlowPanel
- components:
  - name: plot_calibrations
    properties: {height: 380}
    type: Plot

  - name: plot_forecast_instrumentos
    properties: {height: 380}
    type: Plot
  layout_properties: {grid_position: 'G,H'}
  name: flow_panel_instrumentos
  properties: {align: justify, spacing: large}
  type: FlowPanel
container: {type: ColumnPanel}
is_package: true
